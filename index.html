<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1B3D" />

    <!-- Per-route SEO tags: written for each route by scripts/prerender.mjs at build time and
         kept in sync by applySeo() (src/lib/seo.ts) on client-side navigation. The source
         index.html carries homepage defaults for the dev server. -->
    <!--seo:start-->
    <title>Tiara Kebabs &amp; More | Persian Restaurant in Bedford, NS</title>
    <meta name="description" content="Authentic halal Persian kebabs, saffron rice and slow-cooked stews in West Bedford, Halifax. Dine-in, takeout, delivery and reservations. Open daily 11–9." data-seo="description" />
    <meta name="robots" content="index, follow, max-image-preview:large" data-seo="robots" />
    <link rel="canonical" href="https://www.tiararestaurant.ca/" data-seo="canonical" />
    <meta property="og:type" content="website" data-seo="og:type" />
    <meta property="og:site_name" content="Tiara Kebabs &amp; More" data-seo="og:site_name" />
    <meta property="og:title" content="Tiara Kebabs &amp; More | Persian Restaurant in Bedford, NS" data-seo="og:title" />
    <meta property="og:url" content="https://www.tiararestaurant.ca/" data-seo="og:url" />
    <meta property="og:image" content="https://www.tiararestaurant.ca/images/logo/og-image.jpg" data-seo="og:image" />
    <meta name="twitter:card" content="summary_large_image" data-seo="twitter:card" />
    <meta name="twitter:image" content="https://www.tiararestaurant.ca/images/logo/og-image.jpg" data-seo="twitter:image" />
    <!--seo:end-->

    <!-- Lovelace Text Regular renders every H1 -->
    <link rel="preload" href="/fonts/lovelace/lovelace-text-regular.otf" as="font" type="font/otf" crossorigin />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logo/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo/favicon-180.png" />
  </head>
  <body>
    <!-- Legacy SPA redirect handler: decodes old "/?/menu" style links into clean paths -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
