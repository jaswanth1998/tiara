events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/javascript js mjs;
        text/css css;
    }

# tiaraWebsite1


     server {
        listen 80;
        server_name demo.plaper.org;

        root /usr/share/nginx/html/tiaraWebsite1;
        index index.html;

        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name plaper.org www.plaper.org;

        root /usr/share/nginx/html/plaper;
        index index.html;

        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;

        location /jenkins/ {
            proxy_pass http://host.docker.internal:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/jenkins(/.*)$ $1 break;
        }

        location /sonarqube/ {
            proxy_pass http://host.docker.internal:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/sonarqube(/.*)$ $1 break;
        }
    }
}