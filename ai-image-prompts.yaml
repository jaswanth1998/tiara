      wedge. A small matte black round ramekin of creamy
      garlic-yogurt sauce on the same plate. Dark stone surface.

  - id: persian-stew-tahdig
    name: Persian Stew & Tahdig
    category: Starters
    file_path: public/images/food/persian-stew-tahdig
    aspect_ratio: "3:4"
