      A matte black round fluted ceramic bowl holding silky
      smooth hummus swirled into a classic spiral well, filled
      with a golden pool of olive oil in the center, sprinkled
      with sumac and smoked paprika, topped with whole
      chickpeas and chopped parsley. Warm triangular pita
      wedges fanned on the dark stone surface beside the bowl,
      with a single lemon wedge.

