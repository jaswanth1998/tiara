# ============================================================
# Tiara Kebabs & More — AI Image Generation Prompts
# ============================================================
# Style reference:
#   assests/pics/Main Pictures/ChatGPT Image Apr 6, 2026, 02_15_16 PM.png
#   (and every other image in that folder)
#
# Purpose: Generate missing menu photography in the EXACT same
#          style as the client's approved reference set.
#
# How to use (ChatGPT / DALL·E / Midjourney / Flux / Gemini):
#   1. ALSO UPLOAD one of the reference images from
#      `assests/pics/Main Pictures/` as a visual style reference
#      whenever the tool supports image input. This is the single
#      most important step for consistency.
#   2. Copy `style_guide.base_prompt` + the item's `prompt`
#      into the text prompt.
#   3. Append `style_guide.negative_prompt` if the tool supports it.
#   4. Use the aspect ratio + technical settings below.
#   5. Save as: public/images/food/<item-id>-lg.webp
#      (plus -md.webp, -sm.webp, -md.jpg variants).
# ============================================================

meta:
  restaurant: Tiara Kebabs & More
  cuisine: Persian / Iranian
  location: Bedford, Nova Scotia
  reference_folder: assests/pics/Main Pictures/
  hero_reference: ChatGPT Image Apr 6, 2026, 02_15_16 PM.png
  target_resolution: 2048x2560 minimum (portrait)
  aspect_ratio_single_dish: "3:4 (portrait)"
  aspect_ratio_family_platter: "4:3 (landscape)"
  aspect_ratio_drink: "3:4 (portrait)"
  output_format: WebP (or PNG then convert)

# ------------------------------------------------------------
# STYLE GUIDE — paste this in front of EVERY item prompt.
# Locked to the client's approved reference photography.
# ------------------------------------------------------------
style_guide:
  base_prompt: >
    Ultra-realistic professional restaurant food photography,
    editorial magazine quality, shot on a full-frame DSLR with a
    50mm f/1.8 lens. Styled on a dark textured stone surface —
    near-black charcoal marble with subtle warm-brown veining and
    natural cracks catching the light. The background is moody,
    deep, and atmospheric with rich negative space.
    Dramatic directional side-lighting from the upper-right casts
    warm golden highlights on the food and deep, soft shadows
    across the stone. High contrast, rich saturated colors,
    cinematic color grading with crushed blacks and glowing
    warm mid-tones. Shot from a three-quarter overhead angle
    (roughly 45 to 55 degrees), dish positioned slightly
    off-center for composition, camera tilted slightly to show
    the food's height and dimension.
    Plating is on a matte black rectangular ceramic plate with
    ribbed / fluted edges (for hero dishes) or in a matte black
    round ceramic bowl with a fluted rim (for bowls, stews,
    sides). Every kebab or grilled main also includes these
    signature garnishes arranged beside the hero item: one
    blistered charred cherry tomato, one long charred green
    chili pepper, a small bunch of fresh basil leaves, two or
    three raw red onion rings, and a bright yellow lemon wedge.
    For kebab/grill dishes, add a companion small matte black
    round plate holding a neat half-dome of saffron-orange
    basmati rice plus two tiny round ramekins — one filled with
    red tomato sauce, one with creamy pale-green yogurt-herb
    sauce. Focus is tack-sharp on the hero food with a softly
    blurred background. No humans, no hands, no text, no logos,
    no watermarks, no captions.

  negative_prompt: >
    cartoon, illustration, 3D render, CGI, stylized, anime,
    painterly, plastic-looking food, over-processed, HDR halos,
    fake steam, fake glow, oversaturated neon colors, vignette,
    fisheye, tilted horizon line, cluttered background, busy
    tablecloths, patterned wallpaper behind the plate, wooden
    cutting boards, rustic picnic look, bright daylight, flat
    even lighting, soft-box studio flat look, human hands,
    fingers, arms, people, faces, chef coats, text, watermarks,
    logos, captions, price tags, labels, utensils mid-use,
    spilled sauce, dripping mess, wilted herbs, burnt black
    edges, raw-looking meat, undercooked, fake-looking garnish,
    AI artifacts, extra fingers, distorted geometry, low
    resolution, grain, noise, blurry subject, jpeg compression.

  technical:
    camera: "Full-frame DSLR / mirrorless, 50mm f/1.8 prime"
    lighting: "Hard directional side-light from upper-right, warm color temperature (~3200K), deep shadow fall-off on the left"
    surface: "Dark textured stone — charcoal-black marble with subtle warm-brown veining and hairline cracks"
    plate_main: "Matte black rectangular ceramic plate with ribbed / fluted edges"
    plate_bowl: "Matte black round ceramic bowl with a fluted rim"
    companion_plate: "Small matte black round plate for rice + sauce ramekins (kebab dishes only)"
    color_grade: "Cinematic — crushed blacks, warm glowing highlights, rich saturation, high contrast"
    composition: "Hero dish slightly off-center, 3/4 overhead angle (45-55°), dark negative space occupies 30-40% of frame"
    post: "Natural sharpening, no Instagram filter look, true-to-life but punchy food color"

  signature_garnish_kit:
    always_present_for_grills:
      - "one blistered charred cherry tomato"
      - "one long charred green chili pepper"
      - "small bunch of fresh basil leaves"
      - "two to three raw red onion rings"
      - "one bright yellow lemon wedge"
    kebab_companion_plate:
      - "small matte black round plate"
      - "half-dome of saffron-orange basmati rice (sometimes with a single crispy tahdig ball)"
      - "tiny ramekin of red tomato sauce"
      - "tiny ramekin of creamy green yogurt-herb sauce"

  brand_cues:
    primary_navy: "#0F1B3D"
    accent_gold: "#C5A55A"
    notes: >
      Matte black plating reads as premium and lets saffron/gold
      food tones pop — this echoes the navy + gold brand palette
      without literally using navy plates. Warm golden highlights
      on the food act as the accent color.

# ------------------------------------------------------------
# PROMPT TEMPLATE — exactly what to send to the image model
# ------------------------------------------------------------
prompt_template: |
  <style_guide.base_prompt>

  Subject: <item.prompt>

  Negative: <style_guide.negative_prompt>

  Aspect ratio: <item.aspect_ratio>

chatgpt_dalle_example: |
  Use this exact style (match the attached reference photo):
  ultra-realistic editorial food photography on a dark textured
  charcoal-marble stone surface, hard warm side-light from the
  upper-right, 3/4 overhead angle, matte black ribbed rectangular
  plate, cinematic crushed-black background, rich warm
  highlights, tack-sharp focus.

  Subject: <paste item.prompt here>

  Signature garnish (must be present for grills): charred cherry
  tomato, charred long green chili, fresh basil bunch, red onion
  rings, lemon wedge, companion matte black plate with saffron
  rice half-dome and two tiny ramekins of red and green sauce.

  No people, no hands, no text, no watermarks. 3:4 portrait
  aspect ratio.

midjourney_example: |
  <style_guide.base_prompt> <item.prompt>
  --ar 3:4 --style raw --v 7 --s 250 --q 2
  --no cartoon, illustration, 3d, plastic, text, watermark,
  logo, hands, people, flat lighting, wood background,
  cluttered, tilted

# ------------------------------------------------------------
# MENU ITEMS — prompts for every dish currently missing a photo
# ------------------------------------------------------------
items:

  # -------- STARTERS --------
  - id: yogurt-persian-shallots
    name: Yogurt and Persian Shallots (Mast-o-Moosir)
    category: Starters
    file_path: public/images/food/yogurt-persian-shallots
    aspect_ratio: "3:4"
    prompt: >
      A matte black round fluted ceramic bowl filled with thick,
      creamy Persian yogurt (mast-o-moosir), finely chopped dark
      purple Persian shallots swirled through the top, a glossy
      drizzle of amber olive oil pooling in the center, a pinch
      of dried mint dusted across, and a single fresh mint sprig
      placed at the edge. The bowl sits on the dark textured
      stone surface. A torn piece of warm sangak flatbread
      resting just beside the bowl. Hard warm side-light,
      3/4 overhead angle.

  - id: crispy-coated-fries
    name: Crispy Coated Fries
    category: Starters
    file_path: public/images/food/crispy-coated-fries
    aspect_ratio: "3:4"
    prompt: >
      A generous pile of golden-crisp seasoned coated fries,
      each fry glistening, dusted with paprika and sea salt,
      stacked high on a matte black ribbed rectangular plate.
      A small round matte black ramekin of garlic aioli and a
      second ramekin of spicy red ketchup on the same plate.
      A sprig of parsley on top of the fries. Dark stone
      surface, dramatic warm side-light.

  - id: hummus
    name: Hummus
    category: Starters
    file_path: public/images/food/hummus
    aspect_ratio: "3:4"
