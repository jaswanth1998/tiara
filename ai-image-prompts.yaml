# ------------------------------------------------------------
# WORKFLOW TIPS
# ------------------------------------------------------------
workflow:
  recommended_approach: >
    Use ChatGPT (GPT-5 with image) or Gemini and ATTACH one of
    the reference images from `assests/pics/Main Pictures/` as
    a visual style reference for EVERY prompt. This is the
    single biggest lever for style consistency. Then paste the
    base_prompt + item.prompt text together.

  tools_ranked_for_this_style:
    - "ChatGPT (GPT-5 native image) — upload reference + prompt, best style-matching to this exact look"
    - "Google Gemini 2.5 / Imagen 4 — strong with attached reference images"
    - "Midjourney v7 — use --sref with reference image URL + --style raw"
    - "Flux.1 Pro Ultra (with Redux/IP-Adapter) — excellent food realism"
    - "DALL·E 3 — works for single items but weaker at matching a specific style"

  consistency_tips:
    - "Generate the ENTIRE missing set in one session on one tool to keep color grade and lighting consistent."
    - "Always attach the SAME reference image as style reference across every generation so lighting and surface match."
    - "For kebab dishes, include the signature_garnish_kit explicitly — it is the visual signature of this brand."
    - "Generate 3-4 variants per item and pick the one where plate material, lighting direction, and surface texture match the reference best."
    - "If a result lands on wood or a pale surface, regenerate — the dark stone is mandatory."

  post_processing:
    - "Export at 2048px on the long edge minimum (prefer 3072px)."
    - "Create sizes: -lg (2048w), -md (1024w), -sm (512w)."
    - "Convert to WebP for -lg/-md/-sm and keep a JPG fallback at -md."
    - "Place in public/images/food/ following the existing naming pattern."
    - "Update src/data/menu.ts to add `image: '/images/food/<id>'` on each item."
